# DIAGNOSTICS manuels, lecture seule : diag_catalogue.py (listes filtrées), diag_prix.py (prix des annonces vendues),
# diag_produits.py (regroupement en produits, aucune requête Vinted).
# Ne tourne jamais en même temps que la collecte d'un relevé. La base est lue, jamais modifiée ni publiée.
name: Diagnostic (lecture seule)
on:
  workflow_dispatch:
    inputs:
      test:
        description: "produits = volume par produit (sans requête Vinted) ; prix ; catalogue"
        type: choice
        options: [produits, prix, catalogue]
        default: produits
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
      NICHES_CLE: ${{ secrets.NICHES_CLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q curl_cffi cryptography==44.0.0
      - name: Base (lecture seule)
        run: |
          bash base.sh cle_presente
          gh release download donnees -p vinted.v2.gcm --clobber
          bash base.sh dechiffrer vinted.v2.gcm vinted.db
      - name: Test
        env:
          TEST: ${{ inputs.test }}
        run: python "diag_$TEST.py"
