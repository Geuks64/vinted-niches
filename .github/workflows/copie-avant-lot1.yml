# Usage unique : crée avant-lot1.v2.gcm (copie AES-256-GCM de la sauvegarde v1 avant-lot1.db.gz.enc).
# Ne supprime ni n'écrase AUCUN fichier : s'arrête si avant-lot1.v2.gcm existe déjà, envoi sans --clobber.
name: Copie v2 de avant-lot1
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sauvegardes
  cancel-in-progress: false
jobs:
  copie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      NICHES_CLE: ${{ secrets.NICHES_CLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography==44.0.0
      - name: Copie v2 de avant-lot1 (déchiffrer v1, chiffrer v2, vérifier, restaurer, comparer)
        run: |
          bash base.sh cle_presente
          actifs=$(gh release view donnees --json assets --jq '.assets[].name')
          if echo "$actifs" | grep -qx avant-lot1.v2.gcm; then
            echo "avant-lot1.v2.gcm existe déjà : rien n'est écrasé. Arrêt." >&2; exit 1
          fi
          echo "== 1. Sauvegarde v1 d'origine"
          gh release download donnees -p avant-lot1.db.gz.enc
          echo "SHA-256 avant-lot1.db.gz.enc (v1) : $(sha256sum avant-lot1.db.gz.enc | cut -d' ' -f1)"
          bash base.sh dechiffrer_v1 avant-lot1.db.gz.enc original.db
          echo "== 2. Rechiffrement AES-256-GCM"
          bash base.sh chiffrer original.db avant-lot1.v2.gcm
          echo "En-tête (format, itérations, sel, nonce) : $(python3 chiffrage.py info avant-lot1.v2.gcm)"
          echo "== 3-4. Authentification + restauration complète du fichier v2"
          bash base.sh dechiffrer avant-lot1.v2.gcm restauree.db
          echo "== 5. Comparaison octet par octet"
          cmp original.db restauree.db && echo "Base restaurée identique à l'originale (octet par octet)."
          echo "== 6. Empreintes SHA-256"
          sha256sum original.db restauree.db avant-lot1.v2.gcm
          echo "== Publication (sans écrasement)"
          gh release upload donnees avant-lot1.v2.gcm
          echo "== Contre-vérification depuis la Release"
          mkdir publie && cd publie
          gh release download donnees -p avant-lot1.v2.gcm
          cmp avant-lot1.v2.gcm ../avant-lot1.v2.gcm && echo "Fichier publié identique au fichier vérifié."
          bash ../base.sh dechiffrer avant-lot1.v2.gcm restauree-publiee.db
          cmp ../original.db restauree-publiee.db && echo "Restauration depuis la Release : identique à l'originale (octet par octet)."
          sha256sum avant-lot1.v2.gcm restauree-publiee.db
          echo "== Fichiers de la Release après l'opération"
          gh release view donnees --json assets --jq '.assets[] | "\(.name)  \(.size) octets"'
