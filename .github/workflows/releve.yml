# Relevé automatique des annonces Vinted toutes les 20 minutes,
# puis calcul des stats et mise en ligne du tableau de bord (GitHub Pages).
# La base SQLite est conservée entre deux relevés dans la Release « donnees ».
name: Relevé Vinted
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: releve
  cancel-in-progress: false
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Heure de début
        run: echo "DEBUT_JOB=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q curl_cffi cryptography==44.0.0

      - name: Récupérer la base (chiffrée)
        env:
          NICHES_CLE: ${{ secrets.NICHES_CLE }}
        run: |
          # Sans clé : on s'arrête AVANT de relever (rien ne pourrait être sauvegardé, rien n'est publié en clair)
          bash base.sh cle_presente
          # Liste des fichiers de la Release : si GitHub ne répond pas, on S'ARRÊTE (jamais « base vide » par erreur)
          actifs=$(gh release view donnees --json assets --jq '.assets[].name')
          if echo "$actifs" | grep -qx vinted.v2.gcm; then
            # Format v2 (AES-256-GCM authentifié). Échec d'authentification = arrêt immédiat, AUCUN repli sur la v1.
            gh release download donnees -p vinted.v2.gcm --clobber
            bash base.sh dechiffrer vinted.v2.gcm vinted.db
          elif echo "$actifs" | grep -qx vinted.db.gz.enc; then
            # Migration : aucune v2 n'existe encore -> on part de la dernière v1 (qui reste intacte dans la Release)
            echo "Migration v1 -> v2 : lecture de la base v1 (elle ne sera ni modifiée ni supprimée)."
            gh release download donnees -p vinted.db.gz.enc --clobber
            bash base.sh dechiffrer_v1 vinted.db.gz.enc vinted.db
          else
            echo "ERREUR : aucune base trouvée dans la Release « donnees » (ni v2 ni v1). Arrêt par sécurité." >&2
            exit 1
          fi
          # copie de la base AVANT ce relevé (sauvegarde « precedente » publiée chiffrée à la fin)
          cp vinted.db avant.db

      - name: Relevé
        id: collecte
        continue-on-error: true
        run: python collecte.py

      - name: Statistiques
        run: python stats.py

      - name: Sauvegarder la base (chiffrée, v2 authentifiée)
        env:
          NICHES_CLE: ${{ secrets.NICHES_CLE }}
        run: |
          bash base.sh verifier vinted.db
          bash base.sh chiffrer vinted.db vinted.v2.gcm
          # Contrôle avant publication : la copie chiffrée doit s'authentifier et redonner exactement la même base
          bash base.sh dechiffrer vinted.v2.gcm controle.db
          cmp vinted.db controle.db && echo "Copie v2 vérifiée (authentifiée, identique à la base)."
          # Base telle qu'elle était avant ce relevé
          bash base.sh chiffrer avant.db precedente.v2.gcm
          bash base.sh dechiffrer precedente.v2.gcm controle-avant.db
          cmp avant.db controle-avant.db && echo "Sauvegarde « precedente » v2 vérifiée."
          gh release upload donnees precedente.v2.gcm --clobber
          gh release upload donnees vinted.v2.gcm --clobber
          # Sauvegarde datée une fois par jour (vers 3 h UTC). AUCUNE suppression automatique d'ancienne sauvegarde.
          if [ "$(date -u +%H)" = "03" ]; then
            cp vinted.v2.gcm "sauvegarde-$(date -u +%F).v2.gcm"
            gh release upload donnees "sauvegarde-$(date -u +%F).v2.gcm" --clobber
          fi
          # Les anciennes copies v1 (vinted.db.gz.enc, precedente.db.gz.enc, avant-lot1.db.gz.enc) ne sont plus
          # jamais écrites ni supprimées par ce workflow.

      - name: Garder le relevé actif
        # GitHub coupe les tâches planifiées après 60 jours sans commit : un petit commit par mois.
        run: |
          mois=$(date -u +%Y-%m)
          if [ "$(cat .maintien 2>/dev/null)" != "$mois" ]; then
            echo "$mois" > .maintien
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .maintien && git commit -m "Maintien du relevé ($mois)" && git push || true
          fi

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Relance de secours (si la planification GitHub ne se déclenche pas)
        if: always()
        run: |
          # Relevé planifié (cron) dans les 45 dernières minutes ? Alors GitHub s'en occupe, rien à faire.
          derniere=$(gh run list --workflow releve.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$derniere" ] && [ $(( $(date +%s) - $(date -d "$derniere" +%s) )) -lt 2700 ]; then
            echo "La planification GitHub fonctionne : pas de relance."
            exit 0
          fi
          # Un relevé est déjà en attente ? On ne double pas.
          attente=$(gh run list --workflow releve.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$attente" != "0" ]; then
            echo "Un relevé est déjà en attente : pas de relance."
            exit 0
          fi
          # On attend que 20 min se soient écoulées depuis le début de ce relevé, puis on relance.
          reste=$(( 1200 - ($(date +%s) - DEBUT_JOB) ))
          if [ "$reste" -gt 0 ]; then echo "Pause de $reste s avant la relance"; sleep "$reste"; fi
          gh workflow run releve.yml --ref main
          echo "Relevé suivant lancé."

      - name: Résultat du relevé
        if: steps.collecte.outcome == 'failure'
        run: |
          echo "Le relevé a échoué (voir l'étape « Relevé »). Les stats ont quand même été republiées."
          exit 1
