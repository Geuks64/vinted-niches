# Relevé automatique des annonces Vinted toutes les 20 minutes,
# puis calcul des stats et mise en ligne du tableau de bord (GitHub Pages).
# La base SQLite est conservée entre deux relevés dans la Release « donnees ».
name: Relevé Vinted
on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  pages: write
  id-token: write
concurrency:
  group: releve
  cancel-in-progress: false
jobs:
  releve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Heure de début
        run: echo "DEBUT_JOB=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q curl_cffi

      - name: Récupérer la base (chiffrée)
        env:
          NICHES_CLE: ${{ secrets.NICHES_CLE }}
        run: |
          # Sans clé : on s'arrête AVANT de relever (rien ne pourrait être sauvegardé, rien n'est publié en clair)
          bash base.sh cle_presente
          actifs=$(gh release view donnees --json assets --jq '.assets[].name' 2>/dev/null || true)
          if echo "$actifs" | grep -qx vinted.db.gz.enc; then
            # La base existe : on DOIT la récupérer (sinon on écraserait l'historique par une base vide)
            gh release download donnees -p vinted.db.gz.enc --clobber
            bash base.sh dechiffrer vinted.db.gz.enc vinted.db
          elif echo "$actifs" | grep -qx vinted.db.gz; then
            echo "Ancienne base non chiffrée trouvée : elle sera chiffrée à la fin de ce relevé."
            gh release download donnees -p vinted.db.gz --clobber
            gunzip -f vinted.db.gz
            bash base.sh verifier vinted.db
          else
            echo "Première exécution : base vide"
          fi
          # copie de la base AVANT ce relevé (sauvegarde « precedente » publiée chiffrée à la fin)
          if [ -f vinted.db ]; then cp vinted.db avant.db; fi

      - name: Relevé
        id: collecte
        continue-on-error: true
        run: python collecte.py

      - name: Statistiques
        run: python stats.py

      - name: Sauvegarder la base (chiffrée)
        env:
          NICHES_CLE: ${{ secrets.NICHES_CLE }}
        run: |
          bash base.sh verifier vinted.db
          bash base.sh chiffrer vinted.db vinted.db.gz.enc
          # Contrôle avant publication : la copie chiffrée doit redonner exactement la même base
          bash base.sh dechiffrer vinted.db.gz.enc controle.db
          cmp vinted.db controle.db && echo "Copie chiffrée vérifiée (identique à la base)."
          gh release view donnees >/dev/null 2>&1 || \
            gh release create donnees --title "Données du relevé" --notes "Base SQLite CHIFFRÉE (clé : secret NICHES_CLE), mise à jour automatiquement par le workflow « Relevé Vinted ». Ne pas supprimer."
          # Sauvegarde de la base telle qu'elle était avant ce relevé
          if [ -f avant.db ]; then
            bash base.sh chiffrer avant.db precedente.db.gz.enc
            gh release upload donnees precedente.db.gz.enc --clobber
            # copie permanente de la base d'avant la migration « lot 1 » (une seule fois)
            if [ "$(python3 -c "import sqlite3; print(sqlite3.connect('avant.db').execute('PRAGMA user_version').fetchone()[0])")" -lt 2 ]; then
              cp precedente.db.gz.enc avant-lot1.db.gz.enc && gh release upload donnees avant-lot1.db.gz.enc --clobber
            fi
          fi
          gh release upload donnees vinted.db.gz.enc --clobber
          # Sauvegarde datée une fois par jour (vers 3 h UTC), on garde les 14 dernières
          if [ "$(date -u +%H)" = "03" ]; then
            cp vinted.db.gz.enc "sauvegarde-$(date -u +%F).db.gz.enc"
            gh release upload donnees "sauvegarde-$(date -u +%F).db.gz.enc" --clobber
            gh release view donnees --json assets --jq '.assets[].name' | grep '^sauvegarde-.*\.db\.gz\.enc$' \
              | sort | head -n -14 | while read -r vieux; do gh release delete-asset donnees "$vieux" -y; done
          fi
          # Suppression des anciennes copies NON chiffrées (une fois la version chiffrée publiée et vérifiée)
          for f in vinted.db.gz sauvegarde.db.gz; do
            if gh release view donnees --json assets --jq '.assets[].name' | grep -qx "$f"; then
              gh release delete-asset donnees "$f" -y && echo "Ancienne copie non chiffrée supprimée : $f"
            fi
          done

      - name: Garder le relevé actif
        # GitHub coupe les tâches planifiées après 60 jours sans commit : un petit commit par mois.
        run: |
          mois=$(date -u +%Y-%m)
          if [ "$(cat .maintien 2>/dev/null)" != "$mois" ]; then
            echo "$mois" > .maintien
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .maintien && git commit -m "Maintien du relevé ($mois)" && git push || true
          fi

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploiement
        uses: actions/deploy-pages@v4

      - name: Relance de secours (si la planification GitHub ne se déclenche pas)
        if: always()
        run: |
          # Relevé planifié (cron) dans les 45 dernières minutes ? Alors GitHub s'en occupe, rien à faire.
          derniere=$(gh run list --workflow releve.yml --event schedule --limit 1 --json createdAt --jq '.[0].createdAt // empty')
          if [ -n "$derniere" ] && [ $(( $(date +%s) - $(date -d "$derniere" +%s) )) -lt 2700 ]; then
            echo "La planification GitHub fonctionne : pas de relance."
            exit 0
          fi
          # Un relevé est déjà en attente ? On ne double pas.
          attente=$(gh run list --workflow releve.yml --limit 20 --json status \
            --jq '[.[] | select(.status=="queued" or .status=="pending" or .status=="waiting" or .status=="requested")] | length')
          if [ "$attente" != "0" ]; then
            echo "Un relevé est déjà en attente : pas de relance."
            exit 0
          fi
          # On attend que 20 min se soient écoulées depuis le début de ce relevé, puis on relance.
          reste=$(( 1200 - ($(date +%s) - DEBUT_JOB) ))
          if [ "$reste" -gt 0 ]; then echo "Pause de $reste s avant la relance"; sleep "$reste"; fi
          gh workflow run releve.yml --ref main
          echo "Relevé suivant lancé."

      - name: Résultat du relevé
        if: steps.collecte.outcome == 'failure'
        run: |
          echo "Le relevé a échoué (voir l'étape « Relevé »). Les stats ont quand même été republiées."
          exit 1
