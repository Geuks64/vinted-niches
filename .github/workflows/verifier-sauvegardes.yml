# Lecture seule : restaure CHAQUE sauvegarde v2 (*.v2.gcm, AES-256-GCM) de la Release « donnees » et affiche
# authenticité, intégrité SQLite, nombre d'annonces / observations et empreintes SHA-256.
# Les fichiers d'un autre format sont seulement listés (jamais ouverts). Ne modifie ni ne supprime rien.
# La base déchiffrée n'est jamais publiée (ni artefact, ni journal) : seuls des compteurs et empreintes sont affichés.
name: Vérifier les sauvegardes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NICHES_CLE: ${{ secrets.NICHES_CLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography==44.0.0
      - name: Restauration de toutes les sauvegardes
        run: |
          bash base.sh cle_presente
          mkdir verif && cd verif
          echo "== Contenu de la Release"
          gh release view donnees --json assets --jq '.assets[] | "\(.name)  \(.size) octets  maj \(.updatedAt)"'
          ok=0; ko=0; autres=0
          for f in $(gh release view donnees --json assets --jq '.assets[].name'); do
            case "$f" in
              *.v2.gcm) ;;
              *) echo "--  $f : pas au format v2 -> non vérifié (ignoré)"; autres=$((autres+1)); continue ;;
            esac
            if gh release download donnees -p "$f" && bash ../base.sh dechiffrer "$f" "$f.db" > journal.txt 2>&1; then
              echo "OK  $f  (authentique, intégrité SQLite ok)"
              echo "    fichier : $(sha256sum "$f" | cut -d' ' -f1)"
              echo "    base    : $(sha256sum "$f.db" | cut -d' ' -f1)"
              echo "    $(tail -1 journal.txt)"
              ok=$((ok+1))
            else
              echo "ÉCHEC  $f : $(tail -2 journal.txt | tr '\n' ' ')"
              ko=$((ko+1))
            fi
          done
          echo "== Sauvegardes v2 restaurables : $ok, en échec : $ko, autres fichiers non vérifiés : $autres"
          [ "$ko" -eq 0 ] && [ "$ok" -gt 0 ]
