# Lecture seule : restaure CHAQUE sauvegarde de la Release « donnees » (v2 : authentification GCM ; v1 : ancien
# format) et affiche intégrité SQLite + empreintes SHA-256. Ne modifie ni ne supprime rien.
name: Vérifier les sauvegardes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      NICHES_CLE: ${{ secrets.NICHES_CLE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q cryptography==44.0.0
      - name: Restauration de toutes les sauvegardes
        run: |
          bash base.sh cle_presente
          mkdir verif && cd verif
          echo "== Contenu de la Release"
          gh release view donnees --json assets --jq '.assets[] | "\(.name)  \(.size) octets  maj \(.updatedAt)"'
          ok=0; ko=0
          for f in $(gh release view donnees --json assets --jq '.assets[].name'); do
            case "$f" in
              *.v2.gcm)    cmd=dechiffrer ;;
              *.db.gz.enc) cmd=dechiffrer_v1 ;;
              *) echo "?? $f : format inconnu, ignoré"; continue ;;
            esac
            if gh release download donnees -p "$f" && bash ../base.sh "$cmd" "$f" "$f.db" > journal.txt 2>&1; then
              echo "OK  $f  [$cmd]"
              echo "    fichier : $(sha256sum "$f" | cut -d' ' -f1)"
              echo "    base    : $(sha256sum "$f.db" | cut -d' ' -f1)"
              echo "    $(tail -1 journal.txt)"
              ok=$((ok+1))
            else
              echo "ÉCHEC  $f  [$cmd] : $(tail -2 journal.txt | tr '\n' ' ')"
              ko=$((ko+1))
            fi
          done
          if [ -f avant-lot1.db.gz.enc.db ] && [ -f avant-lot1.v2.gcm.db ]; then
            cmp avant-lot1.db.gz.enc.db avant-lot1.v2.gcm.db && echo "avant-lot1 : bases v1 et v2 identiques (octet par octet)."
          fi
          echo "== Restaurables : $ok, en échec : $ko"
          [ "$ko" -eq 0 ]
